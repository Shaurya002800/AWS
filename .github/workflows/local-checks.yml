name: Local checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: rgx
          POSTGRES_PASSWORD: rgx
          POSTGRES_DB: rgx
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rgx -d rgx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RGX_TEST_POSTGRES_DSN: postgresql://rgx:rgx@127.0.0.1:55432/rgx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run offline tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - name: Check generated OpenAPI contract
        run: |
          python -m scripts.export_openapi
          git diff --exit-code -- contracts/api.openapi.json
